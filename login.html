<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca - Iniciar sesión</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="login-container">

        <!-- Lado izquierdo -->
        <div class="welcome-section">

            <div class="welcome-icon">
                <i class="bi bi-book"></i>
            </div>

            <h1>Bienvenido</h1>

            <hr>

            <p>
                Vincula tu cuenta estudiante para poder ingresar
                a nuestra Biblioteca "página préstamo de libros".
            </p>

        </div>


        <!-- Formulario -->
        <div class="form-section">

            <div class="brand-container">

                <div class="brand-logo">
                    <img src="imagenes/images.png" alt="Logo Institución">
                </div>

                <div class="brand-title">
                    Biblioteca Chinchaysuyo
                </div>

                <div class="brand-subtitle">
                    Sistema de Gestión de Préstamos
                </div>

            </div>


            <!-- LOGIN -->
            <form id="loginForm">

                <!-- Usuario -->
                <div class="input-group-custom">

                    <label for="usuario">
                        Usuario
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-person-fill"></i>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Ingrese su usuario"
                            autocomplete="username"
                            required>

                    </div>

                </div>


                <!-- Contraseña -->
                <div class="input-group-custom">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-lock-fill"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingrese su contraseña"
                            autocomplete="current-password"
                            required>

                    </div>

                </div>


                <!-- Mensaje de error -->
                <p id="mensaje"></p>


                <!-- Botón -->
                <button type="submit" class="btn-login">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Iniciar sesión

                </button>

            </form>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="login.js"></script>

</body>

</html>
